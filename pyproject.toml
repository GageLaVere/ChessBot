[project]
name = "chess-bot"
version = "0.1.0"
description = "A playable LangGraph-driven chess bot prototype."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "PySide6>=6.0.0",
    "python-chess>=1.999",
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
